provider: amdgpucloud
label:
  en_US: AMDGPUCloud
  zh_Hans: AMDGPUCloud
description:
  en_US: OpenAI-compatible models from AMD GPU Cloud / Token Factory. Author — Letian Kang. Contact — Letian.Kang@amd.com.
  zh_Hans: AMD GPU Cloud / Token Factory 提供的 OpenAI-compatible 模型。作者：Letian Kang；联系邮箱：Letian.Kang@amd.com。
icon_small:
  en_US: icon.png
  zh_Hans: icon.png
icon_large:
  en_US: icon.png
  zh_Hans: icon.png
background: "#F5F5F5"
help:
  title:
    en_US: Get your AMDGPUCloud API key
    zh_Hans: 获取 AMDGPUCloud API Key
  url:
    en_US: https://developer.amd.com.cn/radeon/modelapis
    zh_Hans: https://developer.amd.com.cn/radeon/modelapis
supported_model_types:
  - llm
configurate_methods:
  - predefined-model
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
        zh_Hans: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your rc-* API key
        zh_Hans: 输入 rc-* API Key
models:
  llm:
    predefined: []
extra:
  python:
    provider_source: provider/amdgpucloud.py
    model_sources:
      - models/llm/llm.py