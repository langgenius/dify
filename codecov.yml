coverage:
  status:
    # Report project coverage per flag (see flag_management) instead of one combined total,
    # so a PR touching only one area is not judged by another area's carried-forward data.
    project: off

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto
        # Absorb sub-percent coverage noise (rounding, trivial added lines, CVA variants, etc).
        threshold: 1%
        # Deleting covered code during refactors/migrations must not regress base.
        removed_code_behavior: adjust_base
  individual_flags:
    - name: web
      paths:
        - "web/"

    - name: dify-ui
      paths:
        - "packages/dify-ui/"

    - name: api
      paths:
        - "api/"

    - name: cli
      paths:
        - "cli/"
