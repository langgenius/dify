identity:
  name: mrscraper_create_prompt_scraper
  author: ai-mrscraper
  label: {en_US: Create Prompt Scraper}
description:
  human: {en_US: Create a reusable General AI scraper from a URL and prompt.}
  llm: Call this to create a reusable prompt-based scraper. Use Extract Page by Prompt when only immediate extraction is wanted.
parameters:
  - {name: url, type: string, required: true, label: {en_US: URL}, human_description: {en_US: Absolute HTTP or HTTPS page URL.}, llm_description: Initial page URL for the reusable scraper., form: llm}
  - {name: prompt, type: string, required: false, label: {en_US: Prompt}, human_description: {en_US: Optional extraction instructions.}, llm_description: Natural-language extraction instructions., form: llm}
  - name: output_schema
    type: object
    required: false
    input_schema: {type: object, additionalProperties: true}
    label: {en_US: Output Schema}
    human_description: {en_US: Optional JSON object describing the expected output shape.}
    llm_description: JSON object describing desired output fields and types.
    form: llm
  - name: mode
    type: select
    required: false
    default: Super
    label: {en_US: Mode}
    human_description: {en_US: Scraping strength. Defaults to Super.}
    llm_description: Choose Super for stronger scraping or Cheap for weakly protected sites.
    form: llm
    options:
      - {value: Super, label: {en_US: Super}}
      - {value: Cheap, label: {en_US: Cheap}}
  - {name: proxy_country, type: string, required: false, label: {en_US: Proxy Country}, human_description: {en_US: Optional proxy country code.}, llm_description: Optional proxy country code., form: llm}
extra:
  python: {source: tools/mrscraper_create_prompt_scraper.py}
