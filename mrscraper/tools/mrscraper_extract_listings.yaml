identity:
  name: mrscraper_extract_listings
  author: ai-mrscraper
  label:
    en_US: Extract Listings
description:
  human:
    en_US: Immediately extract repeated listings or paginated content.
  llm: Call this for immediate multi-item or paginated extraction. Use Create Listing Scraper when a reusable scraper is required.
parameters:
  - name: url
    type: string
    required: true
    label: {en_US: URL}
    human_description: {en_US: Absolute HTTP or HTTPS listing page URL.}
    llm_description: The absolute starting listing URL.
    form: llm
  - name: prompt
    type: string
    required: false
    label: {en_US: Prompt}
    human_description: {en_US: Optional instructions describing each item to extract.}
    llm_description: Natural-language instructions for each listing item.
    form: llm
  - name: output_schema
    type: object
    required: false
    input_schema:
      type: object
      additionalProperties: true
    label: {en_US: Output Schema}
    human_description: {en_US: Optional JSON object describing each item.}
    llm_description: JSON object describing the desired fields and types for each item.
    form: llm
  - name: max_pages
    type: number
    required: false
    default: 1
    min: 1
    precision: 0
    label: {en_US: Max Pages}
    human_description: {en_US: Maximum pagination pages to scrape. Defaults to 1.}
    llm_description: Maximum pagination pages as an integer of at least 1.
    form: llm
  - name: proxy_country
    type: string
    required: false
    label: {en_US: Proxy Country}
    human_description: {en_US: Optional proxy country code.}
    llm_description: Optional proxy country code such as US, GB, ID, or SG.
    form: llm
extra:
  python:
    source: tools/mrscraper_extract_listings.py
