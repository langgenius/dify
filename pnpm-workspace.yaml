  solid-js: 1.9.15
  string-width: ~8.2.2
  tar@<=7.5.15: ^7.5.16
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  ws@>=8.0.0 <8.20.1: ^8.22.0
