allowBuilds:
  '@parcel/watcher': false
  # i18next-resources-for-ts uses the published SWC native binaries.
  '@swc/core': false
  canvas: false
  esbuild: false
  sharp: false
autoDedupe: true
autoInstallPeers: false
blockExoticSubdeps: true
catalogMode: strict
catalogPrune: true
dedupeDirectDeps: true
engineStrict: true
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'
optimisticRepeatInstall: true
resolutionMode: time-based
saveExact: true
shellEmulator: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - reselect@5.1.1
  - semver@6.3.1
verifyDepsBeforeRun: install
packages:
  - web
  - e2e
  - sdks/nodejs-client
  - packages/*
  - cli
overrides:
  '@babel/core@<=7.29.0': ^7.29.1
  '@lexical/code': npm:lexical-code-no-prism@0.41.0
  canvas: ^3.2.3
  esbuild@<0.28.1: ^0.28.2
  # Keep Vitest's optional DOM peer aligned with Web so browser matcher types augment one Vitest instance.
  happy-dom: 'catalog:'
  is-core-module: npm:@nolyfill/is-core-module@^1.0.39
  js-yaml@<=4.1.1: ^4.1.2
  picomatch@>=4.0.0 <4.0.4: 4.0.7
  postcss@<8.5.10: ^8.5.10
  rollup@>=4.0.0 <4.59.0: 4.63.5
  safer-buffer: npm:@nolyfill/safer-buffer@^1.0.44
