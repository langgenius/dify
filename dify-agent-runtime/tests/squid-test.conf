# Minimal permissive Squid config used only by the egress-proxy integration
# test to verify that SHELLCTL_EGRESSPROXY_UPSTREAM chaining works end-to-end
# (the credproxy tunnels through this squid to reach the echo backend).
#
# This is NOT representative of the production squid-agent.conf.template
# ACLs; it intentionally allows everything since the goal here is to prove
# the upstream-chaining *mechanism* works, not to test ACL policy.
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 8080
acl CONNECT method CONNECT

http_access allow CONNECT
http_access allow all

http_port 3128
coredump_dir /var/spool/squid
