name: WCAG Accessibility E2E

on:
  push:
    branches: ["chore/add-wcag-checker"]

permissions:
  contents: read

concurrency:
  group: accessibility-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: WCAG Level ${{ matrix.label }} Accessibility
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - level: a
            label: A
          - level: aa
            label: AA
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup web dependencies
        uses: ./.github/actions/setup-web

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: |
            api/uv.lock

      - name: Install API dependencies
        run: uv sync --project api --dev

      - name: Install Chromium for accessibility E2E
        timeout-minutes: 15
        working-directory: ./e2e
        run: vp run e2e:install:ci:chromium

      - name: Run automated WCAG Level ${{ matrix.label }} checks
        working-directory: ./e2e
        env:
          E2E_ADMIN_EMAIL: e2e-admin@example.com
          E2E_ADMIN_NAME: E2E Admin
          E2E_ADMIN_PASSWORD: E2eAdmin12345
          E2E_FORCE_WEB_BUILD: "1"
          E2E_INIT_PASSWORD: E2eInit12345
        run: vp run e2e:accessibility:${{ matrix.level }}

      - name: Upload accessibility Cucumber report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cucumber-report-accessibility-${{ matrix.level }}
          path: e2e/cucumber-report
          retention-days: 7

      - name: Upload accessibility E2E logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-accessibility-${{ matrix.level }}
          path: e2e/.logs/*.log
          include-hidden-files: true
          retention-days: 7
