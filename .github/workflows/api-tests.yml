name: Run Pytest

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: api-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  api-unit:
    name: API Unit Tests
    runs-on: depot-ubuntu-24.04
    env:
      COVERAGE_FILE: coverage-unit
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version:
          - "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: api/uv.lock

      - name: Check UV lockfile
        run: uv lock --project api --check

      - name: Install dependencies
        run: uv sync --project api --dev

      - name: Run Unit Tests
        run: |
          uv run --project api pytest \
            -p no:benchmark \
            --timeout "${PYTEST_TIMEOUT:-20}" \
            -n auto \
            api/tests/unit_tests \
            api/providers/vdb/*/tests/unit_tests \
            api/providers/trace/*/tests/unit_tests \
            --ignore=api/tests/unit_tests/controllers
          # Controller tests register Flask routes at import time, so keep them out of xdist.
          uv run --project api pytest \
            --timeout "${PYTEST_TIMEOUT:-20}" \
            --cov-append \
            api/tests/unit_tests/controllers

      - name: Upload unit coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-coverage-unit
          path: coverage-unit
          retention-days: 1

  api-im-contact-sync-unit:
    name: API IM Contact Sync Unit Gate
    runs-on: depot-ubuntu-24.04
    env:
      COVERAGE_FILE: coverage-im-contact-sync-unit
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version:
          - "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: api/uv.lock

      - name: Check UV lockfile
        run: uv lock --project api --check

      - name: Install dependencies
        run: uv sync --project api --dev

      - name: Enforce IM Contact Sync planner coverage
        env:
          COVERAGE_FILE: coverage-im-contact-sync-planner
        run: |
          uv run --project api pytest \
            -o addopts='' \
            --import-mode=importlib \
            --cov=core.human_input_v2.im_integration.sync_reconciliation \
            --cov-branch \
            --cov-report=json:coverage-im-contact-sync-planner.json \
            api/tests/unit_tests/core/human_input_v2/test_im_sync_reconciliation.py \
            api/tests/unit_tests/core/human_input_v2/test_im_sync_reconciliation_properties.py \
            api/tests/unit_tests/core/human_input_v2/test_im_sync_reconciliation_contract.py
          uv run --project api python api/dev/check_coverage_gate.py \
            --coverage-json coverage-im-contact-sync-planner.json \
            --scope-manifest api/dev/im_contact_sync_coverage_scope.json \
            --scope planner \
            --minimum-statement 95 \
            --minimum-branch 95

      - name: Enforce IM Contact Sync unit coverage
        run: |
          uv run --project api pytest \
            -o addopts='' \
            --import-mode=importlib \
            --timeout "${PYTEST_TIMEOUT:-60}" \
            --cov \
            --cov-branch \
            --cov-config=api/dev/im_contact_sync.coveragerc \
            --cov-report= \
            api/tests/unit_tests/controllers/common/test_human_input_channel_management.py \
            api/tests/unit_tests/controllers/console/workspace/test_human_input_channels.py \
            api/tests/unit_tests/controllers/console/workspace/test_im_contact_sync_api.py \
            api/tests/unit_tests/core/human_input_v2/test_im_binding_resolution.py \
            api/tests/unit_tests/core/human_input_v2/test_im_integration.py \
            api/tests/unit_tests/core/human_input_v2/test_im_ports.py \
            api/tests/unit_tests/core/human_input_v2/test_im_reconciliation_change_log.py \
            api/tests/unit_tests/core/human_input_v2/test_im_sync_reconciliation.py \
            api/tests/unit_tests/core/human_input_v2/test_im_sync_reconciliation_properties.py \
            api/tests/unit_tests/core/human_input_v2/test_im_sync_reconciliation_contract.py \
            api/tests/unit_tests/core/human_input_v2/test_shared_values.py \
            api/tests/unit_tests/migrations/test_human_input_v2_im_control_plane.py \
            api/tests/unit_tests/migrations/test_im_identity_email_constraint.py \
            api/tests/unit_tests/migrations/test_im_reconciliation_change_log.py \
            api/tests/unit_tests/repositories/human_input_v2/contact_directory/test_repository.py \
            api/tests/unit_tests/repositories/human_input_v2/im_integration/test_im_sync_queries.py \
            api/tests/unit_tests/repositories/human_input_v2/im_integration/test_mappers.py \
            api/tests/unit_tests/repositories/human_input_v2/im_integration/test_protected_writer_routing.py \
            api/tests/unit_tests/repositories/human_input_v2/im_integration/test_reconciliation_input_loader.py \
            api/tests/unit_tests/repositories/human_input_v2/im_integration/test_reconciliation_unit_of_work.py \
            api/tests/unit_tests/repositories/human_input_v2/im_integration/test_repository.py \
            api/tests/unit_tests/repositories/human_input_v2/test_organization_write_unit_of_work.py \
            api/tests/unit_tests/services/human_input_v2/test_contact_im_binding_service.py \
            api/tests/unit_tests/services/human_input_v2/test_im_contact_sync_composition.py \
            api/tests/unit_tests/services/human_input_v2/test_im_contact_sync_coordinator.py \
            api/tests/unit_tests/services/human_input_v2/test_im_contact_sync_worker.py \
            api/tests/unit_tests/services/human_input_v2/test_im_sync_service.py \
            api/tests/unit_tests/services/human_input_v2/test_im_write_lock.py \
            api/tests/unit_tests/services/test_human_input_channel_management_application_composition.py \
            api/tests/unit_tests/services/test_human_input_channel_management_composition.py \
            api/tests/unit_tests/services/test_human_input_channel_management_service.py \
            api/tests/unit_tests/services/test_human_input_im_channel_manager.py
          uv run --project api coverage json \
            --rcfile=api/dev/im_contact_sync.coveragerc \
            -o coverage-im-contact-sync-unit.json
          uv run --project api python api/dev/check_coverage_gate.py \
            --coverage-json coverage-im-contact-sync-unit.json \
            --scope-manifest api/dev/im_contact_sync_coverage_scope.json \
            --scope project \
            --minimum-total 90

  api-integration:
    name: API Integration Tests
    runs-on: depot-ubuntu-24.04
    env:
      COVERAGE_FILE: coverage-integration
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /tmp/dify-storage
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version:
          - "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: api/uv.lock

      - name: Check UV lockfile
        run: uv lock --project api --check

      - name: Install dependencies
        run: uv sync --project api --dev

      - name: Run Integration Tests
        run: |
          uv run --project api pytest \
            -p no:benchmark \
            --start-middleware \
            -n auto \
            --timeout "${PYTEST_TIMEOUT:-180}" \
            api/tests/integration_tests/workflow \
            api/tests/integration_tests/tools \
            api/tests/test_containers_integration_tests

      - name: Upload integration coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-coverage-integration
          path: coverage-integration
          retention-days: 1

  api-im-contact-sync-integration:
    name: API IM Contact Sync Integration Gate
    runs-on: depot-ubuntu-24.04
    env:
      COVERAGE_FILE: coverage-im-contact-sync-integration
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /tmp/dify-storage
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version:
          - "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: api/uv.lock

      - name: Check UV lockfile
        run: uv lock --project api --check

      - name: Install dependencies
        run: uv sync --project api --dev

      - name: Enforce IM Contact Sync integration coverage
        run: |
          uv run --project api pytest \
            -o addopts='' \
            --import-mode=importlib \
            --timeout "${PYTEST_TIMEOUT:-180}" \
            --cov \
            --cov-branch \
            --cov-config=api/dev/im_contact_sync.coveragerc \
            --cov-report= \
            api/tests/test_containers_integration_tests/controllers/console/workspace/test_im_contact_sync_api.py \
            api/tests/test_containers_integration_tests/controllers/console/workspace/test_im_contact_sync_live.py \
            api/tests/test_containers_integration_tests/migrations/test_im_identity_email_constraint.py \
            api/tests/test_containers_integration_tests/migrations/test_im_reconciliation_change_log.py \
            api/tests/test_containers_integration_tests/repositories/human_input_v2/test_contact_directory_postgresql_contract.py \
            api/tests/test_containers_integration_tests/services/human_input_v2/test_im_contact_sync_e2e.py \
            api/tests/test_containers_integration_tests/services/human_input_v2/test_im_control_plane_postgresql_contract.py
          uv run --project api coverage json \
            --rcfile=api/dev/im_contact_sync.coveragerc \
            -o coverage-im-contact-sync-integration.json
          uv run --project api python api/dev/check_coverage_gate.py \
            --coverage-json coverage-im-contact-sync-integration.json \
            --scope-manifest api/dev/im_contact_sync_coverage_scope.json \
            --scope project \
            --minimum-total 80

  api-coverage:
    name: API Coverage
    runs-on: depot-ubuntu-24.04
    needs:
      - api-unit
      - api-integration
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      COVERAGE_FILE: .coverage
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --project api --dev

      - name: Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: coverage-data
          pattern: api-coverage-*
          merge-multiple: true

      - name: Combine coverage
        run: |
          set -euo pipefail

          echo "### API Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Merged backend coverage report generated for Codecov project status." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          unit_coverage="$(find coverage-data -type f -name coverage-unit -print -quit)"
          integration_coverage="$(find coverage-data -type f -name coverage-integration -print -quit)"
          : "${unit_coverage:?coverage-unit artifact not found}"
          : "${integration_coverage:?coverage-integration artifact not found}"

          report_file="$(mktemp)"
          uv run --project api coverage combine "$unit_coverage" "$integration_coverage"
          uv run --project api coverage report --show-missing | tee "$report_file"
          echo "Summary: \`$(tail -n 1 "$report_file")\`" >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "<details><summary>Coverage report</summary>"
            echo ""
            echo '```'
            cat "$report_file"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          uv run --project api coverage xml -o coverage.xml

      - name: Report coverage
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          disable_search: true
          flags: api
        env:
          CODECOV_TOKEN: ${{ env.CODECOV_TOKEN }}
