name: Run Full VDB Tests

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vdb-tests-full-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Full VDB Tests
    if: github.repository == 'langgenius/dify'
    runs-on: depot-ubuntu-24.04
    strategy:
      matrix:
        python-version:
          - '3.13'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@8ffcdf1b35c974f0b10496711e9a22bcb0ff3790 # v4.0.2
        with:
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: api/uv.lock

      - name: Check UV lockfile
        run: uv lock --project api --check

      - name: Install dependencies
        run: uv sync --project api --dev

      #      - name: Set up Vector Store (TiDB)
      #        uses: hoverkraft-tech/compose-action@v2.0.2
      #        with:
      #          compose-file: docker/tidb/docker-compose.yaml
      #          services: |
      #            tidb
      #            tiflash

      #      - name: Check VDB Ready (TiDB)
      #        run: uv run --project api python api/providers/vdb/vdb-tidb-vector/tests/e2e_tests/check_tiflash_ready.py

      - name: Test Vector Stores
        run: |
          uv run --project api pytest \
            --start-vdb \
            --vdb-services "weaviate,qdrant,couchbase-server,etcd,minio,milvus-standalone,pgvecto-rs,pgvector,chroma,elasticsearch,oceanbase" \
            --timeout "${PYTEST_TIMEOUT:-180}" \
            api/providers/vdb/*/tests/e2e_tests
