name: Web Tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Web Tests (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: depot-ubuntu-24.04-4
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    defaults:
      run:
        shell: bash
        working-directory: ./web

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup web environment
        uses: ./.github/actions/setup-web

      - name: Run tests
        run: vp test run --project unit --reporter=minimal --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --coverage

      # Codecov combines the shard uploads under the same commit and web flag.
      - name: Report coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: web/coverage/coverage-final.json
          disable_search: true
          fail_ci_if_error: true
          flags: web
          name: web-${{ matrix.shardIndex }}-${{ matrix.shardTotal }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  browser-test:
    name: Web Browser Tests
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ./web

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup web environment
        uses: ./.github/actions/setup-web

      - name: Install Chromium for Browser Mode
        timeout-minutes: 15
        run: vp exec playwright install --with-deps --only-shell chromium

      - name: Run browser tests
        run: vp test run --project browser --silent=passed-only

      - name: Upload browser failure artifacts
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-failures
          path: web/.vitest-browser/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  dify-ui-test:
    name: dify-ui Tests
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ./packages/dify-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup web environment
        uses: ./.github/actions/setup-web

      - name: Install Chromium for Browser Mode
        timeout-minutes: 15
        run: vp exec playwright install --with-deps --only-shell chromium

      - name: Run dify-ui tests
        run: vp test run --project unit --coverage --silent=passed-only

      - name: Upload dify-ui test failure artifacts
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dify-ui-test-failures
          path: |
            packages/dify-ui/.vitest/attachments/
            packages/dify-ui/.vitest-browser/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Report coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: packages/dify-ui/coverage/coverage-final.json
          disable_search: true
          fail_ci_if_error: true
          flags: dify-ui
          name: dify-ui
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  dify-ui-storybook-test:
    name: dify-ui Storybook Tests
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ./packages/dify-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup web environment
        uses: ./.github/actions/setup-web

      - name: Install Chromium for Browser Mode
        timeout-minutes: 15
        run: vp exec playwright install --with-deps --only-shell chromium

      - name: Run dify-ui Storybook tests
        run: vp run test:storybook

      - name: Upload dify-ui Storybook test failure artifacts
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dify-ui-storybook-test-failures
          path: |
            packages/dify-ui/.vitest/attachments/
            packages/dify-ui/.vitest-browser/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
