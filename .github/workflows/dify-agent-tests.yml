name: Dify Agent Tests

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dify-agent-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  dify-agent-unit:
    name: Dify Agent Unit Tests
    runs-on: depot-ubuntu-24.04
    services:
      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DIFY_AGENT_NATIVE_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        shell: bash
        working-directory: dify-agent
    strategy:
      matrix:
        python-version:
          - '3.13'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: dify-agent/uv.lock

      - name: Check UV lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra server --dev

      - name: Run unit tests
        run: uv run pytest
