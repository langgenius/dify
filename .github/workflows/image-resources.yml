name: Image optimization

on:
  pull_request:

permissions:
  contents: read

jobs:
  image-resources:
    name: Image optimization
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install image checker dependencies
        run: npm ci --prefix scripts/image-resources --ignore-scripts --no-audit --no-fund

      - name: Test image checker
        run: npm test --prefix scripts/image-resources

      - name: Check image optimization
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/image-resources/check-image-resources.mjs --base "$BASE_SHA" --output-dir "$RUNNER_TEMP/image-optimization-candidates"

      - name: Upload optimization candidates
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-optimization-candidates
          path: ${{ runner.temp }}/image-optimization-candidates
          if-no-files-found: ignore
