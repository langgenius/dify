name: Warm E2E Web Build Cache

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'e2e/scripts/**'
      - '.github/actions/setup-web/**'
      - '.github/workflows/e2e-web-build.yml'
      - '.github/workflows/e2e-cache-warm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-cache-warm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    uses: ./.github/workflows/e2e-web-build.yml
    with:
      save-cache: true
      upload-artifact: false
