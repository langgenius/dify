          REPORT = "builder-native-agent-binding.xml"
          code = pytest.main(['api/tests/e2e_tests/containers/services/test_builder_agent_binding.py', 'api/tests/e2e_tests/containers/core/workflow/test_builder_agent_workspace.py', '-vv', '-rA', '--tb=long', '--junitxml=builder-native-agent-binding.xml', '-p', 'no:benchmark', '--no-cov', '--timeout=360', '--timeout-method=thread'])
          problems = []
          identities = set()
          actual = {module: Counter() for module in EXPECTED}
          if not Path(REPORT).is_file():
              problems.append("JUnit report missing")
          else:
              for case in ElementTree.parse(REPORT).getroot().iter("testcase"):
                  classname, name = case.get("classname") or "", case.get("name") or ""
                  identity = (classname, name)
                  if identity in identities:
                      problems.append(f"duplicate case {classname}::{name}")
                  identities.add(identity)
                  module = classname.removeprefix("api.")
                  if module not in EXPECTED:
                      problems.append(f"unexpected module {classname}::{name}")
                  else:
                      actual[module][name.split("[", 1)[0]] += 1
                  if any(case.find(tag) is not None for tag in ("failure", "error", "skipped")):
                      problems.append(f"nonpassing case {classname}::{name}")
          for module, functions in EXPECTED.items():
              print(f"COLLECTED {module}: {sum(actual[module].values())} cases", flush=True)
              if dict(actual[module]) != functions:
                  problems.append(f"case inventory mismatch {module}: {dict(actual[module])!r}")
          print(f"COLLECTED total: {len(identities)} unique cases", flush=True)
          for problem in problems:
              print(f"COMPLETENESS {problem}", flush=True)
          raise SystemExit(int(code) or (1 if problems else 0))
