name: Builder safe execution
on:
  push:
    branches: [build/dify-builder]
    paths:
      - 'api/core/dify_builder/**'
      - 'api/services/dify_builder/**'
      - 'api/services/app_generate_service.py'
      - 'api/tasks/workflow_execute_task.py'
      - 'api/tasks/app_generate/workflow_execute_task.py'
      - 'api/services/credentials/**'
      - 'api/repositories/credentials/**'
      - 'api/services/workflow_service.py'
      - 'api/services/workflow_generator_service.py'
      - 'api/controllers/console/app/workflow.py'
      - 'api/services/data_migration/import_service.py'
      - 'api/events/event_handlers/delete_tool_parameters_cache_when_sync_draft_workflow.py'
      - 'api/tests/unit_tests/events/event_handlers/test_delete_tool_parameters_cache_when_sync_draft_workflow.py'
      - 'api/tests/unit_tests/services/test_draft_tool_admission.py'
      - 'api/tests/unit_tests/repositories/credentials/test_query_repository.py'
      - 'api/pyproject.toml'
      - 'api/uv.lock'
      - 'api/core/app/**'
      - 'api/core/workflow/**'
      - 'api/core/repositories/**'
      - 'api/models/dify_builder.py'
      - 'api/migrations/versions/*builder*'
      - 'api/tests/**/dify_builder/**'
      - 'api/tests/**/test_builder*'
      - 'api/tests/fixtures/workflow/builder_restricted/**'
      - '.github/workflows/builder-safe-execution-tests.yml'
      # Confirmed Tool owners: controllers, Tool/OAuth/plugin, config, credentials, worker and sweeper.
      - 'api/controllers/console/dify_builder*.py'
      - 'api/controllers/console/wraps.py'
      - 'api/core/tools/**'
      - 'api/core/plugin/**'
      - 'api/core/helper/credential_utils.py'
      - 'api/core/helper/encrypter.py'
      - 'api/core/helper/provider_cache.py'
      - 'api/core/helper/provider_encryption.py'
      - 'api/configs/**'
      - 'api/models/account.py'
      - 'api/models/tools.py'
      - 'api/models/workflow.py'
      - 'api/services/tools/**'
      - 'api/services/plugin/**'
      - 'api/libs/key_providers/**'
      - 'api/libs/rsa.py'
      - 'api/extensions/ext_celery.py'
      - 'api/extensions/ext_redis.py'
      - 'api/tasks/dify_builder_advance_task.py'
      - 'api/schedule/dify_builder_reconcile_task.py'
      - 'api/tests/test_containers_integration_tests/conftest.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: builder-safe-execution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /tmp/dify-builder-storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --project api --dev --locked
      - name: Real native persistence, PostgreSQL races and migration gate
        shell: bash
        run: |
          set -o pipefail
          timeout --kill-after=30s 45m uv run --project api --no-sync python -u - <<'PY' 2>&1 | tee builder-safe-execution.log
          import xml.etree.ElementTree as ElementTree
          from pathlib import Path

          import pytest

          JUNIT = "builder-safe-execution.xml"
          # Every required case, per module and test function, with its exact collected count.
          # The run is not accepted if a module or case is missing, skipped/xfailed or unexpected.
          EXPECTED = {
              "test_builder_restricted_native": {
                  "test_actual_native_port_to_persistence": 3,
                  "test_real_native_result_missing_proof_is_unknown": 4,
                  "test_composed_prelaunch_refusals_have_no_native_id": 6,
                  "test_composed_worker_reload_trace_race_refuses": 1,
                  "test_composed_effective_default_binding": 1,
                  "test_async_native_repositories_without_delivered_saves_stay_unknown": 1,
                  "test_ordinary_native_scalar_execution_remains_ordinary": 1,
                  "test_composed_class_replacement_refuses_before_native_validation": 1,
                  "test_composed_http_retry_receipts_and_recorder_poison": 2,
                  "test_composed_canonical_seal_replay_cannot_upgrade_or_change": 1,
                  "test_composed_template_exact_outputs_are_sealed_native_sql_success": 6,
                  "test_composed_renamed_template_and_multi_template_chain": 1,
                  "test_composed_http_body_to_template_remains_sealed_simulation": 1,
                  "test_composed_unsafe_template_refuses_without_native_allocation": 5,
                  "test_composed_template_cumulative_output_overflow_is_native_failure": 1,
                  "test_composed_template_text_without_complete_sql_proof_cannot_publish": 4,
                  "test_composed_template_seal_replay_rejects_changed_output": 1,
                  "test_composed_template_normal_workflow_citation_defaults_are_preserved": 1,
                  "test_composed_citation_display_change_invalidates_reserved_template_context": 2,
              },
              "test_workflow_empty_draft": {
                  "test_postgres_empty_save_state_transition": 20,
                  "test_postgres_empty_draft_confirmation_is_scoped_to_full_owner_chain": 4,
                  "test_postgres_trusted_internal_empty_sync_remains_supported": 2,
              },
              "test_builder_execution_policy_persistence": {
                  "test_postgres_duplicate_claim_has_one_winner": 1,
                  "test_postgres_append_race_preserves_both_receipts": 1,
                  "test_postgres_append_seal_and_duplicate_seal_are_serialized": 1,
                  "test_real_postgres_execution_migration_upgrade_downgrade": 1,
                  "test_real_postgres_forward_merge_preserves_both_branches": 1,
                  "test_postgres_context_owner_replay_is_rejected": 7,
              },
              "test_builder_real_call_consent_persistence": {
                  "test_postgres_identical_prepare_collision_has_one_row": 1,
                  "test_postgres_simultaneous_execute_commits_exactly_one_launch": 1,
                  "test_postgres_execute_with_colliding_keys_has_one_winner": 1,
                  "test_postgres_reservation_and_unrelated_commit_cannot_both_advance": 1,
                  "test_postgres_stale_session_cas_rolls_back_every_reservation_write": 1,
                  "test_postgres_simultaneous_tool_claims_have_one_winner_and_survive_restart": 1,
                  "test_postgres_simultaneous_phase_claims_spend_once": 2,
                  "test_postgres_expiry_boundary_blocks_the_grant_claim": 1,
                  "test_postgres_spend_blocked_on_row_lock_across_expiry_is_refused": 2,
                  "test_postgres_refresh_cas_never_overwrites_same_timestamp_rotation": 1,
                  "test_postgres_concurrent_client_change_never_admits_a_stale_business_claim": 1,
                  "test_race_tables_are_built_by_the_actual_migrations": 1,
                  "test_real_postgres_consent_migration_upgrade_downgrade": 1,
              },
              "test_builder_confirmed_tool_native": {
                  "test_confirmed_native_run_reads_once_without_refresh": 1,
                  "test_confirmed_native_run_refreshes_once_then_reads": 1,
                  "test_cache_invalidation_failure_after_refresh_cas_stays_unknown_without_business": 1,
                  "test_restricted_default_run_has_zero_decrypt_refresh_or_invoke": 1,
                  "test_ordinary_native_gmail_workflow_stays_ordinary": 1,
                  "test_published_native_gmail_workflow_runs_the_published_graph": 1,
                  "test_changes_after_reservation_are_denied_without_effects": 9,
                  "test_postgres_tool_claim_has_one_winner": 1,
                  "test_duplicate_native_launches_create_one_run": 1,
                  "test_host_report_transfer_is_bounded_and_the_host_reaped": 3,
                  "test_refresh_cas_conflict_keeps_the_rotation_and_blocks_business": 1,
                  "test_partial_stream_is_unknown": 1,
                  "test_native_success_with_text_only_result_is_unknown": 1,
                  "test_expiry_blocks_a_new_phase": 1,
                  "test_completion_of_a_dispatched_phase_after_expiry_is_recorded": 1,
                  "test_crash_after_refresh_claim_before_persistence_settles_unknown_once": 1,
                  "test_crash_after_business_claim_before_transport_settles_unknown_once": 1,
                  "test_same_token_worker_deliveries_activate_once": 1,
                  "test_agent_setup_failure_settles_the_grant_without_spend": 1,
                  "test_transient_settlement_failure_is_repaired_by_the_terminal_scan": 1,
                  "test_terminal_repair_never_settles_a_fresh_live_reservation": 1,
                  "test_completed_grant_replays_and_receipts_stay_durable": 1,
                  "test_held_lease_duplicates_never_enqueue_twice": 1,
                  "test_held_lease_replay_refuses_another_actor_and_a_changed_scope": 1,
                  "test_dispatch_coordinator_metadata_read_runs_outside_sql": 1,
                  "test_stale_recovery_sweep_never_settles_a_fresh_reservation": 1,
                  "test_dispatched_recovery_survives_a_paused_old_sweep": 1,
                  "test_non_oauth_prepare_has_no_grant_or_sensitive_effect": 2,
                  "test_non_oauth_change_after_reservation_is_refused_before_claim": 2,
                  "test_legacy_non_oauth_native_selection_refuses_before_sensitive_effects": 2,
                  "test_authenticated_request_wrappers_reserve_replay_and_refuse_outside_sql": 2,
                  "test_authenticated_enabled_rbac_denial_has_no_reservation": 2,
                  "test_actual_authentication_refusal_precedes_real_call_work": 2,
                  "test_authenticated_enabled_rbac_maintainer_bypass_keeps_bounded_sql": 1,
                  "test_authenticated_enabled_rbac_bound_agent_app_is_not_plain_app": 2,
              },
          }


          class ImmediateFailureReport:
              def pytest_runtest_logreport(self, report: pytest.TestReport) -> None:
                  if report.failed:
                      print(f"\nFAILED {report.nodeid} [{report.when}]", flush=True)
                      print(report.longreprtext, flush=True)
                      for heading, content in report.sections:
                          print(f"\n{heading}\n{content}", flush=True)


          def completeness() -> list[str]:
              """Collected cases from the JUnit report checked against EXPECTED; returns the problems."""
              if not Path(JUNIT).is_file():
                  return [f"{JUNIT} was not written"]
              cases: dict[tuple[str, str], str] = {}
              for case in ElementTree.parse(JUNIT).getroot().iter("testcase"):
                  module = (case.get("classname") or "").rsplit(".", 1)[-1]
                  if case.find("skipped") is not None:
                      status = "skipped"
                  elif case.find("failure") is not None or case.find("error") is not None:
                      status = "failed"
                  else:
                      status = "passed"
                  key = (module, case.get("name") or "")
                  if cases.get(key) in (None, "passed"):
                      cases[key] = status
              problems = []
              for module, functions in EXPECTED.items():
                  statuses = [status for (name, _case), status in cases.items() if name == module]
                  print(
                      f"COLLECTED {module}: {len(statuses)} cases, {statuses.count('passed')} passed, "
                      f"{statuses.count('failed')} failed, {statuses.count('skipped')} skipped",
                      flush=True,
                  )
                  for function, count in functions.items():
                      found = [
                          status
                          for (name, case_name), status in cases.items()
                          if name == module and case_name.split("[", 1)[0] == function
                      ]
                      if len(found) != count:
                          problems.append(f"{module}::{function} collected {len(found)} of {count}")
                      if "skipped" in found:
                          problems.append(f"{module}::{function} skipped {found.count('skipped')}")
              for module, case_name in sorted(cases):
                  if case_name.split("[", 1)[0] not in EXPECTED.get(module, {}):
                      problems.append(f"unexpected case {module}::{case_name}")
              print(f"COLLECTED total: {len(cases)} cases", flush=True)
              return problems


          code = pytest.main(
              [
                  "-p",
                  "no:benchmark",
                  "--no-cov",
                  "-vv",
                  "-rA",
                  "--tb=long",
                  "--timeout=360",
                  "--timeout-method=thread",
                  "-o",
                  "faulthandler_timeout=120",
                  "api/tests/test_containers_integration_tests/core/workflow/test_builder_restricted_native.py",
                  "api/tests/test_containers_integration_tests/core/workflow/test_builder_execution_policy_persistence.py",
                  "api/tests/test_containers_integration_tests/core/workflow/test_builder_real_call_consent_persistence.py",
                  "api/tests/test_containers_integration_tests/services/test_workflow_empty_draft.py",
                  "api/tests/test_containers_integration_tests/core/workflow/test_builder_confirmed_tool_native.py",
                  f"--junitxml={JUNIT}",
              ],
              plugins=[ImmediateFailureReport()],
          )
          problems = completeness()
          for problem in problems:
              print(f"COMPLETENESS {problem}", flush=True)
          raise SystemExit(int(code) or (1 if problems else 0))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: builder-safe-execution-native-postgres
          path: |
            builder-safe-execution.xml
            builder-safe-execution.log
  confirmed-tool-units:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --project api --dev --locked
      - name: Confirmed Tool units on the integrated Python runtime
        shell: bash
        run: |
          set -o pipefail
          uv run --project api --no-sync python -u - <<'PY' 2>&1 | tee builder-confirmed-tool-units.log
          import xml.etree.ElementTree as ElementTree
          from pathlib import Path

          import pytest

          JUNIT = "builder-confirmed-tool-units.xml"
          FILES = [
              "api/tests/unit_tests/services/dify_builder/test_reconcile.py",
              "api/tests/unit_tests/services/dify_builder/test_real_call_consent_service.py",
              "api/tests/unit_tests/services/dify_builder/test_confirmed_tool_launch.py",
              "api/tests/unit_tests/services/dify_builder/test_wiring.py",
              "api/tests/unit_tests/controllers/console/test_dify_builder_routes.py",
              "api/tests/unit_tests/controllers/console/test_wraps.py",
              "api/tests/unit_tests/core/dify_builder/test_gmail_read_policy.py",
              "api/tests/unit_tests/core/tools/test_confirmed_tool_runtime.py",
              "api/tests/unit_tests/libs/key_providers/test_rsa_key_provider.py",
              "api/tests/unit_tests/core/helper/test_encrypter.py",
              "api/tests/unit_tests/services/dify_builder/test_resources.py",
              "api/tests/unit_tests/core/workflow/generator/test_tool_catalogue.py",
              "api/tests/unit_tests/services/dify_builder/test_build_cognition.py",
              "api/tests/unit_tests/services/dify_builder/test_build_nodes.py",
              "api/tests/unit_tests/services/dify_builder/test_draft_tool_setup.py",
              "api/tests/unit_tests/services/test_draft_tool_admission.py",
              "api/tests/unit_tests/repositories/credentials/test_query_repository.py",
              "api/tests/unit_tests/events/event_handlers/test_delete_tool_parameters_cache_when_sync_draft_workflow.py",
              "api/tests/unit_tests/services/dify_builder/test_no_repair_gate.py",
              "api/tests/unit_tests/core/dify_builder/test_execution_policy.py",
              "api/tests/unit_tests/core/workflow/test_restricted_execution.py",
              "api/tests/unit_tests/core/workflow/graph_engine/test_builder_restricted_native.py",
              "api/tests/unit_tests/services/dify_builder/test_execution_policy_service.py",
              "api/tests/unit_tests/services/dify_builder/test_json_tool_execution_admission.py",
              "api/tests/unit_tests/services/dify_builder/test_json_tool_execution.py",
              "api/tests/unit_tests/core/dify_builder/test_verification.py",
              "api/tests/unit_tests/core/dify_builder/test_handlers_build.py",
              "api/tests/unit_tests/services/dify_builder/test_localize.py",
              "api/tests/unit_tests/services/dify_builder/test_template_execution.py",
              "api/tests/unit_tests/services/dify_builder/test_template_presentation.py",
              "api/tests/unit_tests/controllers/console/app/test_workflow_empty_draft.py",
          ]
          SELECTED_GUARDS = [
              "api/tests/unit_tests/controllers/console/app/test_workflow.py::test_sync_draft_workflow_rejects_empty_graph_without_confirmation",
          ]
          code = pytest.main([
              *FILES, *SELECTED_GUARDS, "-p", "no:benchmark", "--no-cov", "-vv", "-rA", "--tb=long",
              f"--junitxml={JUNIT}",
          ])
          # Full module identity avoids silently merging same-basename owners.
          module_paths = [*FILES, *(selection.split("::", 1)[0] for selection in SELECTED_GUARDS)]
          modules = {Path(path).with_suffix("").as_posix().removeprefix("api/").replace("/", "."): 0 for path in module_paths}
          identities = set()
          problems = []
          if not Path(JUNIT).is_file():
              problems.append("unit JUnit report missing")
          else:
              for case in ElementTree.parse(JUNIT).getroot().iter("testcase"):
                  classname, name = case.get("classname") or "", case.get("name") or ""
                  normalized = classname.removeprefix("api.")
                  matching = [module for module in modules if normalized == module or normalized.startswith(module + ".")]
                  if len(matching) != 1:
                      problems.append(f"unexpected unit case {classname}::{name}")
                      continue
                  identity = (classname, name)
                  if identity in identities:
                      problems.append(f"duplicate unit case {classname}::{name}")
                  identities.add(identity)
                  modules[matching[0]] += 1
                  if any(case.find(tag) is not None for tag in ("skipped", "failure", "error")):
                      problems.append(f"nonpassing unit case {classname}::{name}")
          for module, count in modules.items():
              print(f"COLLECTED {module}: {count} unit cases", flush=True)
              if count == 0:
                  problems.append(f"missing unit module {module}")
          json_admission_module = "tests.unit_tests.services.dify_builder.test_json_tool_execution_admission"
          expected_json_admission = {
              f"test_owned_json_parse_prepare_persists_restricted_request[{variant}]"
              for variant in ("raw-true", "raw-false", "constant-true", "constant-false")
          }
          actual_json_admission = {
              name for classname, name in identities
              if classname.removeprefix("api.") == json_admission_module
          }
          if actual_json_admission != expected_json_admission:
              problems.append("JSON admission case identities differ from the reviewed four variants")
          json_policy_module = "tests.unit_tests.services.dify_builder.test_json_tool_execution"
          json_policy_expected = {
              "test_reviewed_pure_mixed_graph_admits_exact_native_chain": 1,
              "test_string_source_variants": 6,
              "test_final_parameters_keep_native_boolean": 4,
              "test_non_boolean_ensure_ascii_refuses_before_coercion": 10,
              "test_exact_graph_and_static_tool_shape_refuse_mutations": 29,
              "test_wrong_resolved_tool_class_refuses_before_class_validation": 1,
              "test_pure_mixed_native_marker_source_limits": 3,
              "test_direct_variable_retains_general_name_limit": 1,
              "test_missing_or_duplicated_ensure_ascii_refuses": 1,
              "test_non_pure_mixed_refuses_before_resolution": 12,
              "test_content_constant_lookup_hazards_refuse": 12,
              "test_direct_start_text_keeps_literal_markers_and_dots": 1,
              "test_native_generation_and_log_read_only_declared_start_values": 2,
              "test_native_jsonpath_constant_cannot_read_non_start_value": 1,
              "test_admitted_jsonpath_grammar": 7,
              "test_jsonpath_grammar_refuses_constant_and_resolved_values": 28,
              "test_filter_utf8_byte_boundary": 2,
              "test_content_utf8_byte_boundary": 4,
              "test_parameter_validator_requires_exact_final_types_and_keys": 1,
              "test_qualified_binding_is_frozen_and_strict": 1,
          }
          json_contract_expected = {
              "tests.unit_tests.services.dify_builder.test_execution_policy_service": {
                  "test_historical_restricted_context_tag_and_absence_decode_identically": 1,
                  "test_json_context_digest_covers_qualified_binding": 13,
                  "test_json_context_decodes_through_completion_and_requires_explicit_tag": 1,
              },
              "tests.unit_tests.core.dify_builder.test_execution_policy": {
                  "test_json_evidence_variant_and_receipt_are_strict": 1,
              },
          }
          for module, expected in {json_policy_module: json_policy_expected, **json_contract_expected}.items():
              actual = {}
              for classname, name in identities:
                  if classname.removeprefix("api.") == module:
                      function = name.split("[", 1)[0]
                      actual[function] = actual.get(function, 0) + 1
              for function, expected_count in expected.items():
                  if actual.get(function, 0) != expected_count:
                      problems.append(f"JSON case inventory mismatch {module}::{function}")
              if module == json_policy_module and set(actual) != set(expected):
                  problems.append("unexpected JSON policy test functions")
          print(f"COLLECTED total: {len(identities)} unit cases", flush=True)
          for problem in problems:
              print(f"COMPLETENESS {problem}", flush=True)
          raise SystemExit(int(code) or (1 if problems else 0))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: builder-confirmed-tool-units
          path: |
            builder-confirmed-tool-units.xml
            builder-confirmed-tool-units.log
