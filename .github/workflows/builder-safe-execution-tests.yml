  api-contract-codegen:
    if: github.event_name == 'workflow_dispatch' && inputs.contract_codegen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --project api --dev --locked
      - uses: ./.github/actions/setup-web
      - name: Generate normal API docs and contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p builder-api-contracts
          git rev-parse HEAD > builder-api-contracts/source-commit.txt
          (
            cd api
            uv run --no-sync dev/generate_swagger_markdown_docs.py --swagger-dir ../packages/contracts/openapi --markdown-dir openapi/markdown --keep-swagger-json
          ) 2>&1 | tee builder-api-contracts/docs.log
          pnpm --dir packages/contracts gen-api-contract 2>&1 | tee builder-api-contracts/codegen.log
          git diff --binary -- api/openapi/markdown packages/contracts/generated/api > builder-api-contracts/generated.patch
          git diff --stat -- api/openapi/markdown packages/contracts/generated/api > builder-api-contracts/diff-stat.txt
          git diff --check -- api/openapi/markdown packages/contracts/generated/api
      - name: Check generated contracts
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir packages/contracts type-check 2>&1 | tee builder-api-contracts/type-check.log
      - name: Check Builder contract consumers
        shell: bash
        working-directory: web
        run: |
          set -o pipefail
          vp test run --project unit app/components/workflow-app/components/dify-builder 2>&1 | tee ../builder-api-contracts/builder-consumer-tests.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: builder-api-contracts
          path: builder-api-contracts/

  native-testing-foundation:
    if: github.event_name != 'workflow_dispatch' || !inputs.contract_codegen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /tmp/dify-builder-native-storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --project api --dev --locked
      - name: Native contracts and authorization units
        shell: bash
        run: |
          set -o pipefail
          uv run --project api --no-sync python -u - <<'PY' 2>&1 | tee builder-native-foundation-units.log
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import pytest

          files = [
              "api/tests/unit_tests/services/dify_builder/native_testing/test_contracts.py",
              "api/tests/unit_tests/services/dify_builder/native_testing/test_runtime_contracts.py",
              "api/tests/unit_tests/services/dify_builder/native_testing/test_authorization.py",
          ]
          expected = {path.removeprefix("api/").removesuffix(".py").replace("/", ".") for path in files}
          report = "builder-native-foundation-units.xml"
          code = pytest.main([*files, "-p", "no:benchmark", "--no-cov", "-vv", "-rA", f"--junitxml={report}"])
          problems = []
          seen = set()
          modules = set()
          if not Path(report).is_file():
              problems.append("missing native unit report")
          else:
              for case in ET.parse(report).getroot().iter("testcase"):
                  module = (case.get("classname") or "").removeprefix("api.")
                  identity = (module, case.get("name") or "")
                  if module not in expected or identity in seen:
                      problems.append(f"unexpected or duplicated native unit case: {identity}")
                  modules.add(module)
                  seen.add(identity)
                  if any(case.find(tag) is not None for tag in ("skipped", "failure", "error")):
                      problems.append(f"nonpassing native unit case: {identity}")
              if modules != expected:
                  problems.append(f"native unit module inventory mismatch: {modules}")
          for problem in problems:
              print(f"COMPLETENESS {problem}", flush=True)
          print(f"COLLECTED native units: {len(seen)} unique cases", flush=True)
          raise SystemExit(int(code) or bool(problems))
          PY
      - name: Native effect ledger on real PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          uv run --project api --no-sync python -u - <<'PY' 2>&1 | tee builder-native-foundation.log
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import pytest

          report = "builder-native-foundation.xml"
          expected = {'test_duplicate_delivery_does_not_get_second_permit': 1, 'test_unapproved_and_denied_never_dispatch': 1, 'test_forged_binding_never_dispatches': 4, 'test_rotation_and_cross_tenant_reference_fail_closed': 1, 'test_completed_result_replays_and_changed_intent_conflicts': 1, 'test_iteration_quota_is_shared_and_third_occurrence_waits': 1, 'test_two_processes_compete_for_one_dispatch': 1, 'test_crash_after_committed_claim_becomes_unknown': 1, 'test_budget_reference_requires_matching_identity_and_consumes_no_extra_quota': 1, 'test_configuration_and_interaction_are_not_effect_approvals': 1, 'test_sql_checks_reject_overspend_and_invalid_outcome': 1, 'test_native_migration_upgrade_downgrade_reupgrade': 2, 'test_permission_revocation_and_serialized_revision_drift_never_dispatch': 1, 'test_oauth_requires_its_own_bounded_approval': 1, 'test_permit_returns_only_after_commit_and_releases_request_lock': 1, 'test_child_invocation_shares_root_budget': 1, 'test_legacy_request_cannot_enter_native_waiting': 1, 'test_spent_permit_can_settle_after_cancel_without_new_dispatch': 1, 'test_forged_permit_cannot_record_or_resolve_reservation': 1}
          code = pytest.main([
              "api/tests/test_containers_integration_tests/core/workflow/test_builder_native_effect_ledger.py",
              "-p", "no:benchmark", "--no-cov", "-vv", "-rA", "--tb=long",
              "--timeout=360", "--timeout-method=thread", f"--junitxml={report}",
          ])
          problems = []
          actual = {}
          identities = set()
          expected_module = "tests.test_containers_integration_tests.core.workflow.test_builder_native_effect_ledger"
          if not Path(report).is_file():
              problems.append("missing native foundation report")
          else:
              for case in ET.parse(report).getroot().iter("testcase"):
                  module = (case.get("classname") or "").removeprefix("api.")
                  identity = (module, case.get("name") or "")
                  if module != expected_module or identity in identities:
                      problems.append(f"unexpected or duplicated native case: {identity}")
                  identities.add(identity)
                  name = identity[1].split("[", 1)[0]
                  actual[name] = actual.get(name, 0) + 1
                  if any(case.find(tag) is not None for tag in ("skipped", "failure", "error")):
                      problems.append(f"nonpassing required native case: {name}")
              if actual != expected:
                  problems.append(f"native case inventory mismatch: {actual}")
          for problem in problems:
              print(f"COMPLETENESS {problem}", flush=True)
          raise SystemExit(int(code) or bool(problems))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: builder-native-foundation
          path: |
            builder-native-foundation.xml
            builder-native-foundation.log
            builder-native-foundation-units.xml
            builder-native-foundation-units.log
