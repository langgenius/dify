name: Builder safe execution
on:
  push:
    branches: [build/dify-builder]
    paths:
      - 'api/core/dify_builder/**'
      - 'api/services/dify_builder/**'
      - 'api/services/app_generate_service.py'
      - 'api/tasks/workflow_execute_task.py'
      - 'api/tasks/app_generate/workflow_execute_task.py'
      - 'api/services/credentials/**'
      - 'api/repositories/credentials/**'
      - 'api/services/workflow_service.py'
      - 'api/services/workflow_generator_service.py'
      - 'api/controllers/console/app/workflow.py'
      - 'api/services/data_migration/import_service.py'
      - 'api/events/event_handlers/delete_tool_parameters_cache_when_sync_draft_workflow.py'
      - 'api/tests/unit_tests/events/event_handlers/test_delete_tool_parameters_cache_when_sync_draft_workflow.py'
      - 'api/tests/unit_tests/services/test_draft_tool_admission.py'
      - 'api/tests/unit_tests/repositories/credentials/test_query_repository.py'
      - 'api/pyproject.toml'
      - 'api/uv.lock'
      - 'api/core/app/**'
      - 'api/core/workflow/**'
      - 'api/services/workflow_runtime/**'
      - 'api/services/workflow_generation/**'
      - 'api/core/repositories/**'
      - 'api/models/dify_builder*.py'
      - 'api/services/agent/access_service.py'
      - 'api/services/agent/workspace_service.py'
      - 'api/tests/unit_tests/services/agent/test_workspace_service.py'
      - 'api/tests/unit_tests/controllers/inner_api/test_agent_*.py'
      - 'api/tests/unit_tests/controllers/inner_api/knowledge/test_retrieval.py'
      - 'api/controllers/inner_api/agent/**'
      - 'api/controllers/inner_api/knowledge/retrieval.py'
      - 'api/services/entities/agent_llm_inner.py'
      - 'api/services/entities/agent_tool_inner.py'
      - 'api/services/entities/knowledge_retrieval_inner.py'
      - 'dify-agent/**'
      - 'api/migrations/versions/*builder*'
      - 'api/migrations/versions/*native*'
      - 'api/tests/**/dify_builder/**'
      - 'api/tests/**/test_builder*'
      - 'api/tests/fixtures/workflow/builder_restricted/**'
      - '.github/workflows/builder-safe-execution-tests.yml'
      - '.github/scripts/builder-confirmed-tool-units.py'
      # Confirmed Tool owners: controllers, Tool/OAuth/plugin, config, credentials, worker and sweeper.
      - 'api/controllers/console/dify_builder*.py'
      - 'api/controllers/console/wraps.py'
      - 'api/core/tools/**'
      - 'api/core/plugin/**'
      - 'api/core/helper/credential_utils.py'
      - 'api/core/helper/encrypter.py'
      - 'api/core/helper/provider_cache.py'
      - 'api/core/helper/provider_encryption.py'
      - 'api/configs/**'
      - 'api/models/account.py'
      - 'api/models/tools.py'
      - 'api/models/workflow.py'
      - 'api/services/tools/**'
      - 'api/services/plugin/**'
      - 'api/libs/key_providers/**'
      - 'api/libs/rsa.py'
      - 'api/extensions/ext_celery.py'
      - 'api/extensions/ext_redis.py'
      - 'api/tasks/dify_builder_advance_task.py'
      - 'api/schedule/dify_builder_reconcile_task.py'
      - 'api/tests/e2e_tests/containers/conftest.py'
  workflow_dispatch:
    inputs:
      contract_codegen:
        description: Generate API contracts only, returning reviewed outputs as artifacts
        type: boolean
        default: false
      test_scope:
        description: Select a focused lane; all always runs on build branch pushes
        type: choice
        options:
          [
            all,
            native-agent,
            native-catalog,
            native-continuation,
            native-dispatch,
            native-postgres,
          ]
        default: all
permissions:
  contents: read
concurrency:
  group: builder-safe-execution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-migration-dialects:
    if: github.event_name != 'workflow_dispatch' || (!inputs.contract_codegen && (inputs.test_scope == 'all' || inputs.test_scope == 'native-postgres'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --project api --dev --locked
      - name: Real PostgreSQL and MySQL evidence protections
        run: >-
          uv run --project api --no-sync pytest --no-cov -q
          api/tests/test_containers_integration_tests/migrations/test_builder_native_migration_dialects.py
          --junitxml=builder-migration-dialects.xml
      - name: Require both real dialect cases
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("builder-migration-dialects.xml").getroot().iter("testcase"))
          expected = {
              "test_native_migrations_preserve_checks_and_evidence_on_both_databases[postgresql]",
              "test_native_migrations_preserve_checks_and_evidence_on_both_databases[mysql]",
          }
          assert len(cases) == 2
          assert {case.get("name") for case in cases} == expected
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error"))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: builder-migration-dialects
          path: builder-migration-dialects.xml
  native-postgres:
    if: github.event_name != 'workflow_dispatch' || (!inputs.contract_codegen && (inputs.test_scope == 'all' || inputs.test_scope == 'native-postgres'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /tmp/dify-builder-storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --project api --dev --locked
      - name: Real native persistence, PostgreSQL races and migration gate
        shell: bash
        run: |
          set -o pipefail
          timeout --kill-after=30s 45m uv run --project api --no-sync python -u - <<'PY' 2>&1 | tee builder-safe-execution.log
          import xml.etree.ElementTree as ElementTree
          from pathlib import Path

          import pytest

          JUNIT = "builder-safe-execution.xml"
          # Every required case, per module and test function, with its exact collected count.
          # The run is not accepted if a module or case is missing, skipped/xfailed or unexpected.
          EXPECTED = {
              "test_builder_restricted_native": {
                  "test_ordinary_native_scalar_execution_remains_ordinary": 1,
              },
              "test_workflow_empty_draft": {
                  "test_postgres_empty_save_state_transition": 20,
                  "test_postgres_empty_draft_confirmation_is_scoped_to_full_owner_chain": 4,
                  "test_postgres_trusted_internal_empty_sync_remains_supported": 2,
              },
              "test_builder_execution_policy_persistence": {
                  "test_postgres_duplicate_claim_has_one_winner": 1,
                  "test_postgres_append_race_preserves_both_receipts": 1,
                  "test_postgres_append_seal_and_duplicate_seal_are_serialized": 1,
                  "test_real_postgres_execution_migration_upgrade_downgrade": 1,
                  "test_real_postgres_forward_merge_preserves_both_branches": 1,
                  "test_postgres_context_owner_replay_is_rejected": 7,
              },
              "test_builder_real_call_consent_persistence": {
                  "test_postgres_identical_prepare_collision_has_one_row": 1,
                  "test_postgres_simultaneous_execute_commits_exactly_one_launch": 1,
                  "test_postgres_execute_with_colliding_keys_has_one_winner": 1,
                  "test_postgres_reservation_and_unrelated_commit_cannot_both_advance": 1,
                  "test_postgres_stale_session_cas_rolls_back_every_reservation_write": 1,
                  "test_postgres_simultaneous_tool_claims_have_one_winner_and_survive_restart": 1,
                  "test_postgres_simultaneous_phase_claims_spend_once": 2,
                  "test_postgres_expiry_boundary_blocks_the_grant_claim": 1,
                  "test_postgres_spend_blocked_on_row_lock_across_expiry_is_refused": 2,
                  "test_postgres_refresh_cas_never_overwrites_same_timestamp_rotation": 1,
                  "test_postgres_concurrent_client_change_never_admits_a_stale_business_claim": 1,
                  "test_race_tables_are_built_by_the_actual_migrations": 1,
                  "test_real_postgres_consent_migration_upgrade_downgrade": 1,
              },
              "test_builder_agent_terminal_scan": {
                  "test_terminal_scan_accepts_native_uuid_test_input_ids": 1,
                  "test_terminal_scan_ignores_non_uuid_builder_input_references": 1,
              },
              "test_builder_confirmed_tool_native": {
                  "test_confirmed_native_run_reads_once_without_refresh": 1,
                  "test_confirmed_native_run_refreshes_once_then_reads": 1,
                  "test_cache_invalidation_failure_after_refresh_cas_stays_unknown_without_business": 1,
                  "test_ordinary_native_gmail_workflow_stays_ordinary": 1,
                  "test_published_native_gmail_workflow_runs_the_published_graph": 1,
                  "test_changes_after_reservation_are_denied_without_effects": 9,
                  "test_postgres_tool_claim_has_one_winner": 1,
                  "test_duplicate_native_launches_create_one_run": 1,
                  "test_host_report_transfer_is_bounded_and_the_host_reaped": 3,
                  "test_refresh_cas_conflict_keeps_the_rotation_and_blocks_business": 1,
                  "test_partial_stream_is_unknown": 1,
                  "test_native_success_with_text_only_result_is_unknown": 1,
                  "test_expiry_blocks_a_new_phase": 1,
                  "test_completion_of_a_dispatched_phase_after_expiry_is_recorded": 1,
                  "test_crash_after_refresh_claim_before_persistence_settles_unknown_once": 1,
                  "test_crash_after_business_claim_before_transport_settles_unknown_once": 1,
                  "test_same_token_worker_deliveries_activate_once": 1,
                  "test_agent_setup_failure_settles_the_grant_without_spend": 1,
                  "test_transient_settlement_failure_is_repaired_by_the_terminal_scan": 1,
                  "test_terminal_repair_never_settles_a_fresh_live_reservation": 1,
                  "test_completed_grant_replays_and_receipts_stay_durable": 1,
                  "test_held_lease_duplicates_never_enqueue_twice": 1,
                  "test_held_lease_replay_refuses_another_actor_and_a_changed_scope": 1,
                  "test_dispatch_coordinator_metadata_read_runs_outside_sql": 1,
                  "test_stale_recovery_sweep_never_settles_a_fresh_reservation": 1,
                  "test_dispatched_recovery_survives_a_paused_old_sweep": 1,
                  "test_non_oauth_prepare_has_no_grant_or_sensitive_effect": 2,
                  "test_non_oauth_change_after_reservation_is_refused_before_claim": 2,
                  "test_legacy_non_oauth_native_selection_refuses_before_sensitive_effects": 2,
                  "test_authenticated_request_wrappers_reserve_replay_and_refuse_outside_sql": 2,
                  "test_authenticated_enabled_rbac_denial_has_no_reservation": 2,
                  "test_actual_authentication_refusal_precedes_real_call_work": 2,
                  "test_authenticated_enabled_rbac_maintainer_bypass_keeps_bounded_sql": 1,
                  "test_authenticated_enabled_rbac_bound_agent_app_is_not_plain_app": 2,
              },
          }
          EXPECTED["test_builder_task_controls"] = {
              "test_stop_commits_before_old_worker_actual_draft_write": 2,
              "test_old_worker_draft_commit_before_stop_is_retained": 2,
              "test_resumed_generation_rejects_old_worker_even_at_current_revision": 2,
              "test_late_worker_session_cas_cannot_overwrite_durable_stop": 1,
              "test_control_receipt_replay_survives_resume_without_new_commit": 1,
              "test_simultaneous_same_stop_identity_commits_one_durable_projection": 1,
              "test_delayed_same_stop_receipt_reuses_concurrently_saved_projection": 1,
          }

          class ImmediateFailureReport:
              def pytest_runtest_logreport(self, report: pytest.TestReport) -> None:
                  if report.failed:
                      print(f"\nFAILED {report.nodeid} [{report.when}]", flush=True)
                      print(report.longreprtext, flush=True)
                      for heading, content in report.sections:
                          print(f"\n{heading}\n{content}", flush=True)


          def completeness() -> list[str]:
              """Collected cases from the JUnit report checked against EXPECTED; returns the problems."""
              if not Path(JUNIT).is_file():
                  return [f"{JUNIT} was not written"]
              cases: dict[tuple[str, str], str] = {}
              for case in ElementTree.parse(JUNIT).getroot().iter("testcase"):
                  module = (case.get("classname") or "").rsplit(".", 1)[-1]
                  if case.find("skipped") is not None:
                      status = "skipped"
                  elif case.find("failure") is not None or case.find("error") is not None:
                      status = "failed"
                  else:
                      status = "passed"
                  key = (module, case.get("name") or "")
                  if cases.get(key) in (None, "passed"):
                      cases[key] = status
              problems = []
              for module, functions in EXPECTED.items():
                  statuses = [status for (name, _case), status in cases.items() if name == module]
                  print(
                      f"COLLECTED {module}: {len(statuses)} cases, {statuses.count('passed')} passed, "
                      f"{statuses.count('failed')} failed, {statuses.count('skipped')} skipped",
                      flush=True,
                  )
                  for function, count in functions.items():
                      found = [
                          status
                          for (name, case_name), status in cases.items()
                          if name == module and case_name.split("[", 1)[0] == function
                      ]
                      if len(found) != count:
                          problems.append(f"{module}::{function} collected {len(found)} of {count}")
                      if "skipped" in found:
                          problems.append(f"{module}::{function} skipped {found.count('skipped')}")
              for module, case_name in sorted(cases):
                  if case_name.split("[", 1)[0] not in EXPECTED.get(module, {}):
                      problems.append(f"unexpected case {module}::{case_name}")
              print(f"COLLECTED total: {len(cases)} cases", flush=True)
              return problems


          code = pytest.main(
              [
                  "-p",
                  "no:benchmark",
                  "--no-cov",
                  "-vv",
                  "-rA",
                  "--tb=long",
                  "--timeout=360",
                  "--timeout-method=thread",
                  "-o",
                  "faulthandler_timeout=120",
                  "api/tests/e2e_tests/containers/core/workflow/test_builder_restricted_native.py",
                  "api/tests/e2e_tests/containers/core/workflow/test_builder_execution_policy_persistence.py",
                  "api/tests/e2e_tests/containers/core/workflow/test_builder_real_call_consent_persistence.py",
                  "api/tests/e2e_tests/containers/services/test_workflow_empty_draft.py",
                  "api/tests/e2e_tests/containers/core/workflow/test_builder_confirmed_tool_native.py",
                  "api/tests/e2e_tests/containers/core/workflow/test_builder_agent_terminal_scan.py",
                  "api/tests/e2e_tests/containers/core/workflow/test_builder_task_controls.py",
                  f"--junitxml={JUNIT}",
              ],
              plugins=[ImmediateFailureReport()],
          )
          problems = completeness()
          for problem in problems:
              print(f"COMPLETENESS {problem}", flush=True)
          raise SystemExit(int(code) or (1 if problems else 0))
          PY

  confirmed-tool-units:
    if: github.event_name != 'workflow_dispatch' || (!inputs.contract_codegen && (inputs.test_scope == 'all' || inputs.test_scope == 'native-catalog'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --project api --dev --locked
      - name: Confirmed Tool units on the integrated Python runtime
        shell: bash
        run: |
          set -o pipefail
          uv run --project api --no-sync python -u - < .github/scripts/builder-confirmed-tool-units.py 2>&1 | tee builder-confirmed-tool-units.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: builder-confirmed-tool-units
          path: |
            builder-confirmed-tool-units.xml
            builder-confirmed-tool-units.log
  native-continuation:
    if: github.event_name != 'workflow_dispatch' || (!inputs.contract_codegen && (inputs.test_scope == 'all' || inputs.test_scope == 'native-continuation'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /tmp/dify-builder-continuation-storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --project api --dev --locked
      - name: Native continuation durability on real PostgreSQL and protected storage
        shell: bash
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/builder_native_continuation_runner.py" <<'PY'
          if __name__ == "__main__":
              import xml.etree.ElementTree as ElementTree
              from collections import Counter
              from pathlib import Path

              import pytest

              EXPECTED = {'tests.e2e_tests.containers.core.workflow.test_builder_native_continuation': {'test_checkpoint_real_encrypted_storage_roundtrip_and_snapshot': 1, 'test_missing_checkpoint_ack_never_reports_resumable_waiting': 1, 'test_fake_checkpoint_and_cross_invocation_reference_rejected': 1, 'test_result_owner_digest_and_completed_effect_replay': 1, 'test_resume_double_submit_same_generation_and_single_worker_claim': 1, 'test_enqueue_ack_loss_republishes_same_dispatch': 1, 'test_crash_after_worker_claim_is_unknown_never_new_effect': 1, 'test_pending_resolution_requires_actual_owner_completion': 2, 'test_cancellation_stops_tree_and_projects_claimed_unknown': 1, 'test_expiry_and_foreign_actor_fail_resume': 1, 'test_production_dispatch_without_native_collaborator_fails_closed': 1, 'test_child_input_owner_and_unique_identity_and_completion_wakeup': 1, 'test_revision_drift_fix_does_not_mutate_old_run': 1, 'test_actual_membership_revocation_stops_resume': 1, 'test_real_process_resume_and_worker_claim_race': 1, 'test_checkpoint_sql_commit_failure_never_acknowledges_wait': 1, 'test_checkpoint_readback_corruption_never_acknowledges_wait': 1, 'test_claim_recovery_requires_native_fencing_proof': 1, 'test_child_wait_requires_committed_child_and_parent_checkpoints': 1, 'test_cancellation_of_unclaimed_dispatch_never_launches': 1, 'test_migration_keeps_checkpoint_and_payload_evidence_immutable': 1, 'test_native_runtime_uses_same_checkpoint_and_terminal_stops_new_effects': 1, 'test_cancel_cleanup_reconciles_actual_native_evidence': 1, 'test_resume_rechecks_checkpoint_before_consuming_generation': 2, 'test_resumed_child_can_checkpoint_a_second_native_wait': 1, 'test_unknown_root_quarantines_active_child_tree': 1, 'test_returned_unknown_root_quarantines_descendants': 1, 'test_unknown_child_does_not_wake_parent_or_leave_grandchild_active': 1, 'test_current_membership_required_before_private_decrypt': 16, 'test_actual_child_app_permission_checked_before_decrypt': 4, 'test_spent_result_write_survives_membership_revocation_but_read_does_not': 1, 'test_invocation_read_owner_is_sql_immutable': 10, 'test_legacy_null_owner_fails_closed_without_decrypt': 1, 'test_invocation_read_owner_must_be_paired': 1, 'test_child_dispatch_recovery_requires_controlling_ancestor_fence': 2, 'test_child_claim_rechecks_unknown_ancestor_even_with_stale_active_delivery': 1, 'test_terminal_child_dispatch_stays_terminal_after_ancestor_recovery': 2, 'test_child_terminal_settlement_while_recovery_proof_is_held': 3}}
              EXPECTED.update({'tests.e2e_tests.containers.core.workflow.test_builder_native_pause': {'test_host_barrier_returns_only_real_committed_wait_category': 3, 'test_host_barrier_survives_two_real_pause_generations': 1, 'test_host_barrier_owner_failure_never_returns_waiting': 4, 'test_host_journal_real_completed_result_replays_without_second_claim': 1, 'test_host_journal_real_unknown_result_never_becomes_replayable': 1, 'test_host_journal_refuses_foreign_private_input_before_effect': 3}})
