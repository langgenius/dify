          import xml.etree.ElementTree as ElementTree
          from collections import Counter
          from pathlib import Path

          import pytest

          EXPECTED = {'tests.e2e_tests.containers.services.test_builder_agent_binding': {'test_real_catalog_filters_publication_tenant_and_actor_before_pagination': 1, 'test_draft_graph_and_native_binding_rollback_together': 1, 'test_publication_pointer_cannot_change_between_prepare_and_native_sync': 1}}
