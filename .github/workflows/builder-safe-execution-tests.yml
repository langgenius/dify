name: Builder draft execution

on:
  push:
    branches: [build/dify-builder]
    paths:
      - 'api/**'
      - '.github/workflows/builder-safe-execution-tests.yml'
  pull_request:
    paths:
      - 'api/**/dify_builder*/**'
      - 'api/**/dify_builder*.py'
      - 'api/tests/**/test_builder_ordinary_agent.py'
      - '.github/workflows/builder-safe-execution-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  builder-draft-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --project api --dev --locked
      - name: Verify Builder handlers and Console routes
        run: >-
          uv run --project api --no-sync pytest --no-cov -q
          api/tests/unit_tests/core/dify_builder/test_handlers_build.py
          api/tests/unit_tests/core/dify_builder/test_handlers_edit.py
          api/tests/unit_tests/core/dify_builder/test_handlers_fix.py
          api/tests/unit_tests/core/dify_builder/test_publication_gate.py
          api/tests/unit_tests/controllers/console/test_dify_builder_routes.py
      - name: Run an Agent node in the ordinary Workflow debugger
        run: >-
          uv run --project api --no-sync pytest --no-cov -q
          api/tests/e2e_tests/containers/core/workflow/test_builder_ordinary_agent.py
