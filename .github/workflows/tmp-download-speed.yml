# TEMPORARY: compare download speeds between Depot and GitHub-hosted runners. Remove before merge.
name: Download speed probe

on:
  pull_request:
    branches: ['main']
    paths:
      - .github/workflows/tmp-download-speed.yml

permissions:
  contents: read

jobs:
  probe:
    name: Probe (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [depot-ubuntu-24.04, depot-ubuntu-24.04-4, ubuntu-24.04]
    steps:
      - name: Measure downloads
        run: |
          probe() {
            curl -sS -o /dev/null -L --max-time 120 \
              -w "%{http_code}\t%{size_download}\t%{speed_download}\t%{time_total}\t%{remote_ip}\t$1\n" \
              "$2" || echo "fail\t-\t-\t-\t-\t$1"
          }
          {
            printf 'http\tbytes\tB/s\tseconds\tip\ttarget\n'
            for round in 1 2; do
              probe "nodejs.org node 24.22.1 (round $round)" https://nodejs.org/download/release/v24.22.1/node-v24.22.1-linux-x64.tar.gz
            done
            probe "GitHub mirror node 24.22.1" https://github.com/actions/node-versions/releases/download/24.22.1-39619001896/node-24.22.1-linux-x64.tar.gz
            probe "npm registry next@16.4.2 (44MB)" https://registry.npmjs.org/next/-/next-16.4.2.tgz
            probe "npm registry @next/swc-linux-x64-gnu" https://registry.npmjs.org/@next/swc-linux-x64-gnu/-/swc-linux-x64-gnu-16.4.3.tgz
            probe "npm registry @pnpm/exe.linux-x64@12.10.1" https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.10.1.tgz
            probe "npm registry typescript 5.9.3 (small)" https://registry.npmjs.org/typescript/-/typescript-5.9.3.tgz
            probe "raw.githubusercontent.com" https://raw.githubusercontent.com/voidzero-dev/vite-plus/v1.4.0/packages/cli/install.sh
            probe "PyPI numpy wheel" https://files.pythonhosted.org/packages/source/n/numpy/numpy-2.3.4.tar.gz
          } | tee results.tsv | column -t -s $'\t'
          {
            echo "### ${{ matrix.runner }}"
            echo
            echo '| target | http | MB | MB/s | seconds | ip |'
            echo '| --- | ---: | ---: | ---: | ---: | --- |'
            tail -n +2 results.tsv | awk -F'\t' '{ printf "| %s | %s | %.1f | %.2f | %s | %s |\n", $6, $1, $2/1048576, $3/1048576, $4, $5 }'
          } >> "$GITHUB_STEP_SUMMARY"
