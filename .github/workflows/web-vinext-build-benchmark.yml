name: Web Vinext Build Benchmark

on:
  pull_request:
    paths:
      - '.github/workflows/web-vinext-build-benchmark.yml'

permissions:
  contents: read

concurrency:
  group: web-vinext-build-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Temporary measurement of the full Vinext pipeline on the same runner class
# as Web Bundle Size. No SSR, reference-analysis, or standalone stages are skipped.
jobs:
  build:
    name: Full Vinext build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup web environment
        uses: ./.github/actions/setup-web

      - name: Full production build
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          started=$SECONDS
          pnpm exec vinext build 2>&1 | tee "$RUNNER_TEMP/vinext-build.log"
          elapsed=$((SECONDS - started))
          printf '## Full Vinext build\n\nBuild completed in **%s seconds** on ubuntu-24.04.\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"
          printf '\nAll reference-analysis, RSC, client, SSR, and standalone stages use the existing project configuration.\n' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist/client dist/server dist/standalone >> "$RUNNER_TEMP/vinext-output-sizes.txt"
          cat "$RUNNER_TEMP/vinext-output-sizes.txt"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vinext-build-benchmark
          path: |
            ${{ runner.temp }}/vinext-build.log
            ${{ runner.temp }}/vinext-output-sizes.txt
            web/dist/client/.vite/manifest.json
          include-hidden-files: true
          retention-days: 7
