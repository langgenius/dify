name: Build docker image

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - api/Dockerfile
      - api/Dockerfile.dockerignore
      - api/pyproject.toml
      - api/uv.lock
      - dify-agent/pyproject.toml
      - dify-agent/README.md
      - dify-agent/src/**
      - web/Dockerfile
      - dify-agent-runtime/docker/Dockerfile
      - dify-agent-runtime/go.mod
      - dify-agent-runtime/go.sum
      - dify-agent-runtime/cmd/**
      - dify-agent-runtime/internal/**

concurrency:
  group: docker-build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-docker:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - service_name: 'api-amd64'
            platform: linux/amd64
            runs_on: depot-ubuntu-24.04-4
            context: '{{defaultContext}}'
            file: 'api/Dockerfile'
          - service_name: 'api-arm64'
            platform: linux/arm64
            runs_on: depot-ubuntu-24.04-4
            context: '{{defaultContext}}'
            file: 'api/Dockerfile'
          - service_name: 'web-amd64'
            platform: linux/amd64
            runs_on: depot-ubuntu-24.04-4
            context: '{{defaultContext}}'
            file: 'web/Dockerfile'
          - service_name: 'web-arm64'
            platform: linux/arm64
            runs_on: depot-ubuntu-24.04-4
            context: '{{defaultContext}}'
            file: 'web/Dockerfile'
          - service_name: 'local-sandbox-amd64'
            platform: linux/amd64
            runs_on: depot-ubuntu-24.04-4
            context: '{{defaultContext}}:dify-agent-runtime'
            file: 'docker/Dockerfile'
          - service_name: 'local-sandbox-arm64'
            platform: linux/arm64
            runs_on: depot-ubuntu-24.04-4
            context: '{{defaultContext}}:dify-agent-runtime'
            file: 'docker/Dockerfile'
    steps:
      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2

      - name: Build Docker Image
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          push: false
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.build_contexts }}
          platforms: ${{ matrix.platform }}

  build-docker-fork:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - service_name: 'api-amd64'
            context: '{{defaultContext}}'
            file: 'api/Dockerfile'
          - service_name: 'web-amd64'
            context: '{{defaultContext}}'
            file: 'web/Dockerfile'
          - service_name: 'local-sandbox-amd64'
            context: '{{defaultContext}}:dify-agent-runtime'
            file: 'docker/Dockerfile'
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.build_contexts }}
          platforms: linux/amd64
