name: E2E Cache Experiment

on:
  pull_request:
    paths:
      - '.github/workflows/e2e-cache-experiment*.yml'

permissions:
  contents: read
  actions: read

jobs:
  repeat:
    strategy:
      fail-fast: false
      matrix:
        mode: [existing, fresh]
        sample: [1, 2, 3]
    uses: ./.github/workflows/e2e-cache-experiment-build.yml
    with:
      mode: ${{ matrix.mode }}
      sample: ${{ matrix.sample }}
