name: E2E Web Build

on:
  workflow_call:
    inputs:
      save-cache:
        type: boolean
        default: true
      upload-artifact:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Prepare Core E2E Web Build
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute build source hash
        id: build-source
        shell: bash
        run: |
          # Hash tracked build inputs, excluding generated files and backend-only changes.
          source_hash=$(git ls-tree -r HEAD -- web packages e2e/scripts e2e/package.json e2e/test-env.ts package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc .github/actions/setup-web .github/workflows/e2e-web-build.yml | sha256sum | cut -d ' ' -f 1)
          echo "hash=$source_hash" >> "$GITHUB_OUTPUT"

      - name: Setup web dependencies
        uses: ./.github/actions/setup-web

      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: web/.next/cache
          key: e2e-next-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-${{ steps.build-source.outputs.hash }}
          restore-keys: |
            e2e-next-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-

      - name: Run E2E support unit tests
        working-directory: ./e2e
        run: vp run test:unit

      - name: Build production Web app
        working-directory: ./e2e
        env:
          E2E_FORCE_WEB_BUILD: '1'
          CACHE_HIT: ${{ steps.next-cache.outputs.cache-hit || 'false' }}
        run: |
          started=$SECONDS
          vp run e2e:web:build
          {
            echo "### E2E Web build"
            echo "Build: $((SECONDS - started))s"
            echo "Exact cache hit: $CACHE_HIT (false can include a compatible fallback)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package Web build
        run: >-
          tar -cf e2e-web-build.tar -C web
          .next/BUILD_ID
          .next/e2e-web-build.sha256
          .next/standalone
          .next/static

      - name: Upload Web build
        if: inputs.upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-e2e-web-build
          path: e2e-web-build.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Save Next.js build cache
        if: inputs.save-cache && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: web/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
