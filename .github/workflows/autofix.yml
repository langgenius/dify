name: autofix.ci
on:
  pull_request:
    branches: ['main']
  merge_group:
    branches: ['main']
    types: [checks_requested]
permissions:
  contents: read
  pull-requests: read

jobs:
  # Preserve the existing required check name.
  autofix:
    if: github.repository == 'langgenius/dify'
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify generated files
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            compose:
              - 'docker/generate_docker_compose'
              - 'docker/.env.example'
              - 'docker/envs/**'
              - 'docker/docker-compose-template.yaml'
              - 'docker/docker-compose.yaml'
              - '.github/workflows/autofix.yml'
            api:
              - 'api/**'
              - 'dify-agent/src/**'
              - 'dify-agent/pyproject.toml'
              - 'packages/contracts/openapi-ts.api.config.ts'
              - 'packages/contracts/package.json'
              - 'packages/contracts/openapi/**'
              - 'packages/contracts/generated/api/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'vite.config.ts'
              - 'web/app/styles/globals.css'
              - 'Makefile'
              - '.github/actions/setup-web/**'
              - '.github/workflows/autofix.yml'

      - name: Setup Python
        if: steps.changes.outputs.compose == 'true' || steps.changes.outputs.api == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Generate Docker Compose
        if: steps.changes.outputs.compose == 'true'
        run: ./docker/generate_docker_compose

      - name: Setup UV
        if: steps.changes.outputs.api == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup web environment
        if: steps.changes.outputs.api == 'true'
        uses: ./.github/actions/setup-web

      - name: Generate API artifacts
        if: steps.changes.outputs.api == 'true'
        run: make generate-api-artifacts

      - name: Verify generated files
        id: verify
        run: |
          changes=$(git status --porcelain --untracked-files=all -- \
            docker/docker-compose.yaml api/openapi/markdown packages/contracts/generated/api)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            git diff --stat -- docker/docker-compose.yaml api/openapi/markdown packages/contracts/generated/api
            echo "Generated files are out of date. Run ./docker/generate_docker_compose or make generate-api-artifacts." >&2
            exit 1
          fi

      - name: Offer generated file fixes
        if: failure() && steps.verify.outcome == 'failure' && github.event_name == 'pull_request'
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          commit-message: 'chore: regenerate API and Docker artifacts'
