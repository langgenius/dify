name: Setup Web Environment
description: Set up Node.js, Vite+, pnpm, and web dependencies

inputs:
  run-install:
    description: Install web dependencies after setting up the toolchain
    default: 'true'
  cache-save:
    description: Save the dependency cache after the job completes
    default: 'true'

runs:
  using: composite
  steps:
    # Reuse the runner tool cache or GitHub's Node builds before falling back to nodejs.org.
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        package-manager-cache: false
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
      with:
        node-manager: false
        package-manager: |
          pnpm: true
          npm: false
        cache: true
        # Nested composite post actions can evaluate inputs in the outer scope.
        cache-save: ${{ inputs.cache-save || 'true' }}
        run-install: false
    - name: Install web dependencies
      if: inputs.run-install == 'true'
      shell: bash
      # setup-node already provides the pinned runtime; pnpm must not download it again.
      run: pnpm install --frozen-lockfile --no-runtime
