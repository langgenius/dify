name: Setup Web Environment
description: Set up Node.js, Vite+, pnpm, and web dependencies

inputs:
  run-install:
    description: Install web dependencies after setting up the toolchain
    default: 'true'
  cache-save:
    description: Save the pnpm store cache after installing when no cache matched the lockfile
    default: 'true'

runs:
  using: composite
  steps:
    # setup-node resolves engines.node from the runner tool cache or GitHub's mirror.
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        package-manager-cache: false
    # pnpm/setup restores its lockfile verification log and, with `cache: true`,
    # the pnpm store keyed on the shared lockfile. Without the store cache every
    # job re-downloads all packages before installing.
    - name: Setup pnpm
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        install: false
        cache: true
        # Read-only jobs restore the store but do not write it back.
        save-cache: ${{ inputs.cache-save || 'true' }}
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-manager: false
        package-manager: |
          pnpm: false
          npm: false
        # setup-vp's dependency cache falls back to the newest store for the OS and never
        # prunes it, so every lockfile change saves a bigger store. The steps below cache a
        # store built from the current lockfile only.
        cache: false
        run-install: false
    - name: Resolve pnpm store
      id: pnpm-store
      if: ${{ inputs.run-install == 'true' }}
      shell: bash
      run: echo "path=$(vp pm cache dir)" >> "$GITHUB_OUTPUT"
    # No restore-keys: a store from an older lockfile only adds stale packages to the save.
    - name: Restore pnpm store
      id: restore-pnpm-store
      if: ${{ inputs.run-install == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install web dependencies
      if: ${{ inputs.run-install == 'true' }}
      shell: bash
      run: vp install
    # Depot's cache is shared by every branch. GitHub's cache is scoped to the ref, so a
    # GitHub-hosted PR save is invisible to other PRs and only pays the upload.
    - name: Save pnpm store
      if: >-
        ${{ inputs.run-install == 'true' && inputs.cache-save == 'true'
        && steps.restore-pnpm-store.outputs.cache-hit != 'true'
        && (startsWith(runner.name, 'depot-')
        || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.restore-pnpm-store.outputs.cache-primary-key }}
