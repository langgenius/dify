name: Setup Web Environment
description: Set up Node.js, Vite+, pnpm, and web dependencies

inputs:
  run-install:
    description: Install web dependencies after setting up the toolchain
    default: 'true'
  cache-save:
    description: Save the dependency cache after the job completes
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm and Node.js
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        install: false
        # Restore the pnpm store before installing Node.js to reuse its runtime download.
        cache: true
        save-cache: ${{ inputs.cache-save || 'true' }}
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
      with:
        node-manager: false
        package-manager: |
          pnpm: false
          npm: false
        cache: true
        # Nested composite post actions can evaluate inputs in the outer scope.
        cache-save: ${{ inputs.cache-save || 'true' }}
        run-install: ${{ inputs.run-install }}
