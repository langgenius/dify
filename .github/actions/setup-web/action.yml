name: Setup Web Environment
description: Set up Node.js, Vite+, pnpm, and web dependencies

runs:
  using: composite
  steps:
    - name: Setup pnpm and Node.js
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        install: false
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
      with:
        node-manager: false
        package-manager: |
          pnpm: false
          npm: false
        cache: true
        run-install: true
