<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      line-height: 16pt;
      color: #101828;
      background-color: #e9ebf0;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 600px;
      min-height: 380px;
      margin: 40px auto;
      padding: 36px 48px;
      background-color: #fcfcfd;
      border-radius: 16px;
      border: 1px solid #ffffff;
      box-shadow: 0 2px 4px -2px rgba(9, 9, 11, 0.08);
    }

    .header {
      margin-bottom: 24px;
    }

    .header img {
      max-width: 100px;
      height: auto;
    }

    .title {
      font-weight: 600;
      font-size: 24px;
      line-height: 28.8px;
      margin-bottom: 12px;
    }

    .typography {
      font-weight: 400;
      font-style: normal;
      font-size: 14px;
      line-height: 20px;
      color: #354052;
      margin-top: 4px;
      margin-bottom: 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <img src="https://assets.dify.ai/images/logo.png" alt="Dify Logo" />
    </div>
    <p class="title">您的 Dify.AI 账户已成功删除</p>
    <p class="typography">我们写信确认，您的 Dify.AI 账户已根据您的请求成功删除。您的账户已无法访问，您也不能再使用之前的凭据登录。如果您将来希望继续使用 Dify.AI 服务，需要在 30 天后重新创建账户。感谢您曾使用 Dify.AI，也对您的离开感到遗憾。有关删除流程的任何问题或疑虑，请随时联系我们的支持团队。</p>
    <p class="typography">感谢您曾是 Dify.AI 社区的一员。</p>
    <p class="typography">此致</p>
    <p class="typography">Dify.AI 团队</p>
  </div>
</body>

</html>
