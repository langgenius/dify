name: knowledge-fs-middleware

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_fs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_fs}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_fs}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  unstructured:
    image: downloads.unstructured.io/unstructured-io/unstructured-api@sha256:0df934a22e4e893cf15e7aeaf35c463ecc75937758a83099aefdc13041619a1d
    environment:
      UNSTRUCTURED_PARALLEL_MODE_ENABLED: ${UNSTRUCTURED_PARALLEL_MODE_ENABLED:-true}
      UNSTRUCTURED_PARALLEL_MODE_URL: ${UNSTRUCTURED_PARALLEL_MODE_URL:-http://127.0.0.1:8000/general/v0/general}
      UNSTRUCTURED_PARALLEL_MODE_SPLIT_SIZE: ${UNSTRUCTURED_PARALLEL_MODE_SPLIT_SIZE:-6}
      UNSTRUCTURED_PARALLEL_MODE_THREADS: ${UNSTRUCTURED_PARALLEL_MODE_THREADS:-3}
      UNSTRUCTURED_PARALLEL_RETRY_ATTEMPTS: ${UNSTRUCTURED_PARALLEL_RETRY_ATTEMPTS:-0}
    ports:
      - "${UNSTRUCTURED_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G

volumes:
  postgres-data:
