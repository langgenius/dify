# Opt-in Rust shell runtime. Use together with docker-compose.yaml. New local
# allocations use Rust by default; Go remains the preflight fallback and keeps
# ownership of existing unprefixed resources.
#
# Go remains available as local_sandbox. The two services intentionally share
# no state volume: SQLite, tmux sessions, Homes, and Workspaces must never be
# mutated concurrently by different runtime implementations.
services:
  local_sandbox_rust:
    image: ${DIFY_AGENT_LOCAL_SANDBOX_RUST_IMAGE:-dify-agent-local-sandbox-rust:local}
    build:
      context: ../dify-agent-runtime
      dockerfile: docker/Dockerfile.rust
    restart: always
    env_file:
      - path: ./envs/core-services/local-sandbox.env
        required: false
    environment:
      - SHELLCTL_AUTH_TOKEN=${DIFY_AGENT_LOCAL_SANDBOX_RUST_AUTH_TOKEN:-${DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN:-${DIFY_AGENT_SHELLCTL_AUTH_TOKEN:-}}}
      - HTTP_PROXY=http://agent_ssrf_proxy:3128
      - HTTPS_PROXY=http://agent_ssrf_proxy:3128
      - NO_PROXY=localhost,127.0.0.1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - agent_sandbox_network
      - local_sandbox_proxy_network

  agent_backend:
    environment:
      DIFY_AGENT_LOCAL_SANDBOX_RUST_ENDPOINT: ${DIFY_AGENT_LOCAL_SANDBOX_RUST_ENDPOINT:-http://local_sandbox_rust:5004}
      DIFY_AGENT_LOCAL_SANDBOX_RUST_AUTH_TOKEN: ${DIFY_AGENT_LOCAL_SANDBOX_RUST_AUTH_TOKEN:-${DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN:-${DIFY_AGENT_SHELLCTL_AUTH_TOKEN:-}}}
      DIFY_AGENT_LOCAL_SANDBOX_RUST_CANARY_PERCENT: ${DIFY_AGENT_LOCAL_SANDBOX_RUST_CANARY_PERCENT:-100}
      DIFY_AGENT_LOCAL_SANDBOX_PREFLIGHT_TIMEOUT_SECONDS: ${DIFY_AGENT_LOCAL_SANDBOX_PREFLIGHT_TIMEOUT_SECONDS:-1}
